<header class="mobile-header">
    <a href="/" class="brand-link">
        <span class="brand-name">Circlo</span>
    </a>
    <div class="mobile-header-actions">
        {% if request.user.is_authenticated %}
        <a href="{% url 'profile-me' %}" class="mobile-avatar-link">
            <img src="{{ request.user.avatar_url }}" alt="{{ request.user.username }}" class="mobile-avatar-img">
        </a>
        <a href="{% url 'accounts-web:logout' %}" class="icon-btn" title="Logout">&#8618;</a>
        {% else %}
        <a href="{% url 'accounts-web:login' %}" class="btn btn-primary btn-sm">Log In</a>
        {% endif %}
    </div>
</header>
