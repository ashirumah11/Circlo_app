{% extends "base.html" %}

{% block title %}Story by @{{ author.username }} &bull; Circlo{% endblock %}

{% block extra_css %}
<style>
    /* Full-screen story viewer overlay */
    .story-viewer-page {
        position: fixed;
        inset: 0;
        background-color: #0b0b0f;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .story-viewer-card {
        position: relative;
        width: 100%;
        max-width: 440px;
        height: 100vh;
        max-height: 840px;
        background-color: #000;
        border-radius: var(--radius-lg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    /* Segment progress bars */
    .story-progress-container {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        gap: 4px;
        z-index: 20;
    }

    .story-progress-bar {
        flex: 1;
        height: 3px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        overflow: hidden;
    }

    .story-progress-fill {
        height: 100%;
        width: 0%;
        background: #ffffff;
        transition: width 0.05s linear;
    }

    /* Header */
    .story-viewer-header {
        position: absolute;
        top: 24px;
        left: 12px;
        right: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 20;
        color: #fff;
    }

    .story-author-info {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: #fff;
        font-weight: 600;
        font-size: 0.95rem;
        text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .story-author-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid #fff;
        object-fit: cover;
    }

    .story-timestamp {
        font-size: 0.75rem;
        opacity: 0.8;
    }

    .story-close-btn {
        background: rgba(0, 0, 0, 0.4);
        border: none;
        color: #fff;
        font-size: 1.5rem;
        cursor: pointer;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
    }

    .story-close-btn:hover {
        background: rgba(0, 0, 0, 0.7);
    }

    /* Media Area */
    .story-media-viewport {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
    }

    .story-media-element {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    /* Tap/Click Navigation Zones */
    .story-nav-zone {
        position: absolute;
        top: 60px;
        bottom: 70px;
        width: 40%;
        z-index: 15;
        cursor: pointer;
    }

    .story-nav-zone.left {
        left: 0;
    }

    .story-nav-zone.right {
        right: 0;
    }

    /* Bottom Caption & Views */
    .story-footer {
        position: absolute;
        bottom: 16px;
        left: 16px;
        right: 16px;
        z-index: 20;
        color: #fff;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .story-caption-overlay {
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        padding: 8px 14px;
        border-radius: var(--radius-md);
        font-size: 0.9rem;
        line-height: 1.3;
        max-height: 90px;
        overflow-y: auto;
    }

    .story-views-badge {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(6px);
        padding: 4px 10px;
        border-radius: var(--radius-full);
        font-size: 0.8rem;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<div class="story-viewer-page" id="story-viewer-page">
    <div class="story-viewer-card" id="story-card">
        <!-- Progress Bar Segments -->
        <div class="story-progress-container" id="progress-container"></div>

        <!-- Header -->
        <header class="story-viewer-header">
            <a href="{% url 'profile-view' identifier=author.username %}" class="story-author-info">
                <img src="{{ author.avatar_url }}" alt="{{ author.username }}" class="story-author-avatar">
                <div>
                    <div>@{{ author.username }}</div>
                    <span class="story-timestamp" id="story-timestamp"></span>
                </div>
            </a>

            <a href="{% url 'feed' %}" class="story-close-btn" title="Close Story (Esc)">&times;</a>
        </header>

        <!-- Tap Navigation Zones -->
        <div class="story-nav-zone left" id="nav-left" title="Previous story"></div>
        <div class="story-nav-zone right" id="nav-right" title="Next story"></div>

        <!-- Media Viewport -->
        <div class="story-media-viewport" id="media-viewport"></div>

        <!-- Footer Caption & Views -->
        <div class="story-footer">
            <div class="story-caption-overlay" id="story-caption" style="display: none;"></div>
            {% if is_self %}
            <div class="story-views-badge" id="story-views-badge">
                <span class="view-icon">&#128065;</span> <span id="story-views-count">0</span> views
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const storiesData = {{ stories_json|safe }};
    const isSelf = {{ is_self|yesno:"true,false" }};
    const defaultDurationMs = 5000; // 5s for photos

    let currentIndex = 0;
    let progressTimer = null;
    let storyStartTime = 0;
    let elapsedBeforePause = 0;
    let isPaused = false;
    let storyDuration = defaultDurationMs;

    const progressContainer = document.getElementById('progress-container');
    const mediaViewport = document.getElementById('media-viewport');
    const timestampElem = document.getElementById('story-timestamp');
    const captionElem = document.getElementById('story-caption');
    const viewsCountElem = document.getElementById('story-views-count');

    // Build progress bars
    function initProgressBars() {
        progressContainer.innerHTML = '';
        storiesData.forEach((_, idx) => {
            const bar = document.createElement('div');
            bar.className = 'story-progress-bar';
            bar.innerHTML = `<div class="story-progress-fill" id="fill-${idx}"></div>`;
            progressContainer.appendChild(bar);
        });
    }

    function recordView(storyId) {
        if (!isSelf) {
            fetch(`/api/v1/stories/${storyId}/view/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken'),
                    'Content-Type': 'application/json'
                }
            }).catch(err => console.log('View recorded:', err));
        }
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function showStory(index) {
        if (index < 0) {
            index = 0;
        }
        if (index >= storiesData.length) {
            // Story bundle finished -> exit back to feed
            window.location.href = "{% url 'feed' %}";
            return;
        }

        currentIndex = index;
        clearInterval(progressTimer);
        elapsedBeforePause = 0;
        isPaused = false;

        const story = storiesData[currentIndex];

        // Update progress bar states
        storiesData.forEach((_, idx) => {
            const fill = document.getElementById(`fill-${idx}`);
            if (fill) {
                if (idx < currentIndex) {
                    fill.style.width = '100%';
                } else if (idx === currentIndex) {
                    fill.style.width = '0%';
                } else {
                    fill.style.width = '0%';
                }
            }
        });

        // Set media element
        mediaViewport.innerHTML = '';
        if (story.is_video) {
            const video = document.createElement('video');
            video.src = story.media_url;
            video.className = 'story-media-element';
            video.autoplay = true;
            video.playsInline = true;
            video.muted = false;

            video.onloadedmetadata = () => {
                storyDuration = (video.duration * 1000) || defaultDurationMs;
                startProgressTimer();
            };
            mediaViewport.appendChild(video);
        } else {
            const img = document.createElement('img');
            img.src = story.media_url;
            img.alt = 'Story image';
            img.className = 'story-media-element';
            mediaViewport.appendChild(img);
            storyDuration = defaultDurationMs;
            startProgressTimer();
        }

        // Caption & Views
        if (story.caption && story.caption.trim()) {
            captionElem.textContent = story.caption;
            captionElem.style.display = 'block';
        } else {
            captionElem.style.display = 'none';
        }

        if (viewsCountElem && story.views_count !== undefined) {
            viewsCountElem.textContent = story.views_count;
        }

        // Timestamp
        const createdDate = new Date(story.created_at);
        const hoursAgo = Math.max(1, Math.round((new Date() - createdDate) / (1000 * 60 * 60)));
        timestampElem.textContent = `${hoursAgo}h ago`;

        recordView(story.id);
    }

    function startProgressTimer() {
        clearInterval(progressTimer);
        storyStartTime = Date.now() - elapsedBeforePause;

        progressTimer = setInterval(() => {
            if (isPaused) return;

            const elapsed = Date.now() - storyStartTime;
            const progress = Math.min(100, (elapsed / storyDuration) * 100);

            const fill = document.getElementById(`fill-${currentIndex}`);
            if (fill) {
                fill.style.width = `${progress}%`;
            }

            if (elapsed >= storyDuration) {
                clearInterval(progressTimer);
                showStory(currentIndex + 1);
            }
        }, 30);
    }

    // Navigation events
    document.getElementById('nav-left').addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentIndex > 0) {
            showStory(currentIndex - 1);
        } else {
            showStory(0);
        }
    });

    document.getElementById('nav-right').addEventListener('click', (e) => {
        e.stopPropagation();
        showStory(currentIndex + 1);
    });

    // Hold to pause
    const card = document.getElementById('story-card');
    function pause() {
        if (!isPaused) {
            isPaused = true;
            elapsedBeforePause = Date.now() - storyStartTime;
            const video = mediaViewport.querySelector('video');
            if (video) video.pause();
        }
    }
    function resume() {
        if (isPaused) {
            isPaused = false;
            storyStartTime = Date.now() - elapsedBeforePause;
            const video = mediaViewport.querySelector('video');
            if (video) video.play();
        }
    }

    card.addEventListener('mousedown', pause);
    card.addEventListener('mouseup', resume);
    card.addEventListener('touchstart', pause, {passive: true});
    card.addEventListener('touchend', resume);

    // Keyboard navigation (Left, Right, Escape)
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') {
            showStory(currentIndex + 1);
        } else if (e.key === 'ArrowLeft') {
            showStory(currentIndex - 1);
        } else if (e.key === 'Escape') {
            window.location.href = "{% url 'feed' %}";
        }
    });

    // Launch
    if (storiesData.length > 0) {
        initProgressBars();
        showStory(0);
    }
</script>
{% endblock %}
