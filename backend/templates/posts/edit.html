{% extends "base.html" %}

{% block title %}Edit Post &bull; Circlo{% endblock %}

{% block content %}
<div class="create-post-wrapper">
    <div class="create-post-card">
        <header class="create-post-header">
            <h1 class="create-title">Edit post</h1>
        </header>

        <form method="POST" action="{% url 'post-edit-web' pk=post.id %}" class="create-post-form">
            {% csrf_token %}

            <div class="create-post-details" style="border-left: none; width: 100%;">
                <div class="form-group">
                    <label for="caption" class="form-label">Caption</label>
                    <textarea id="caption" name="caption" rows="5" class="form-textarea" placeholder="Write a caption...">{{ post.caption }}</textarea>
                </div>

                <div class="form-group">
                    <label for="location" class="form-label">Location</label>
                    <input type="text" id="location" name="location" class="form-input" placeholder="e.g. Kyoto, Japan" value="{{ post.location }}">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{% url 'post-detail-web' pk=post.id %}" class="btn btn-outline">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
