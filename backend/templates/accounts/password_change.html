{% extends "base.html" %}

{% block title %}Change Password &bull; Circlo{% endblock %}

{% block content %}
<div class="auth-card-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <h2 class="auth-title">Change Password</h2>
            <p class="auth-subtitle">Update your password to keep your account secure.</p>
        </div>

        <form method="POST" action="{% url 'accounts-web:password-change' %}" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="current_password" class="form-label">Current password</label>
                <input type="password" id="current_password" name="current_password" class="form-input" required autofocus autocomplete="current-password">
            </div>

            <div class="form-group">
                <label for="new_password" class="form-label">New password</label>
                <input type="password" id="new_password" name="new_password" class="form-input" placeholder="At least 8 characters" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="new_password_confirm" class="form-label">Confirm new password</label>
                <input type="password" id="new_password_confirm" name="new_password_confirm" class="form-input" required autocomplete="new-password">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Password</button>
                <a href="{% url 'profile-me' %}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
