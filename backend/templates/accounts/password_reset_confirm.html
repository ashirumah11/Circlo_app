{% extends "base.html" %}

{% block title %}Set New Password &bull; Circlo{% endblock %}

{% block content %}
<div class="auth-card-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <h2 class="auth-title">Create new password</h2>
            <p class="auth-subtitle">Choose a strong, secure password for your account.</p>
        </div>

        <form method="POST" action="" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="new_password" class="form-label">New password</label>
                <input type="password" id="new_password" name="new_password" class="form-input" placeholder="At least 8 characters" required autofocus autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="new_password_confirm" class="form-label">Confirm new password</label>
                <input type="password" id="new_password_confirm" name="new_password_confirm" class="form-input" placeholder="Repeat new password" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
