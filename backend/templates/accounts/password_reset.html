{% extends "base.html" %}

{% block title %}Reset Password &bull; Circlo{% endblock %}

{% block content %}
<div class="auth-card-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <h2 class="auth-title">Reset your password</h2>
            <p class="auth-subtitle">Enter your registered email address and we will dispatch a password reset link.</p>
        </div>

        <form method="POST" action="{% url 'accounts-web:password-reset' %}" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="email" class="form-label">Email address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autofocus autocomplete="email">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>

        <div class="auth-card-footer">
            <a href="{% url 'accounts-web:login' %}" class="auth-link">&larr; Back to Log In</a>
        </div>
    </div>
</div>
{% endblock %}
