services:
  db:
    image: postgres:16-alpine
    container_name: circlo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-circlo_db}
      POSTGRES_USER: ${POSTGRES_USER:-circlo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circlo_secure_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-circlo_user} -d ${POSTGRES_DB:-circlo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - circlo_network

  redis:
    image: redis:7-alpine
    container_name: circlo_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - circlo_network

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: circlo_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app/backend
      - media_data:/app/backend/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgres://${POSTGRES_USER:-circlo_user}:${POSTGRES_PASSWORD:-circlo_secure_password}@db:5432/${POSTGRES_DB:-circlo_db}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - circlo_network

  celery_worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: circlo_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app/backend
      - media_data:/app/backend/media
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgres://${POSTGRES_USER:-circlo_user}:${POSTGRES_PASSWORD:-circlo_secure_password}@db:5432/${POSTGRES_DB:-circlo_db}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - circlo_network

  celery_beat:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: circlo_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgres://${POSTGRES_USER:-circlo_user}:${POSTGRES_PASSWORD:-circlo_secure_password}@db:5432/${POSTGRES_DB:-circlo_db}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - circlo_network

volumes:
  postgres_data:
    name: circlo_postgres_data
  redis_data:
    name: circlo_redis_data
  media_data:
    name: circlo_media_data

networks:
  circlo_network:
    name: circlo_network
    driver: bridge
